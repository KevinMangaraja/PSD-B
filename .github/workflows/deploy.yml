name: Deploy MyST Book to GitHub Pages

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda bernama master

# Memberikan izin yang diperlukan untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu deployment yang berjalan dalam satu waktu
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan action resmi MyST untuk melakukan build
      - name: Build MyST Site
        uses: jupyter-book/mystmd-action@v1
        with:
          action: build
          html: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4