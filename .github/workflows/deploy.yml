name: Deploy MyST Book to GitHub Pages

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda bernama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Action resmi MyST Markdown yang benar
      - name: Build MyST Site
        uses: executablebooks/mystmd-action@v1
        with:
          action: build
          html: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4